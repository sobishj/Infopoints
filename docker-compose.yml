# InfoPoint services. Document roots are mounted by docker-compose.roots.yml,
# which scripts/gen_roots.py generates from ALLOWED_DOC_ROOTS in .env.
name: infopoint

x-app: &app
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://infopoint:infopoint@db:5432/infopoint
    MODELS_DIR: /models
    DATA_DIR: /data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: infopoint
      POSTGRES_PASSWORD: infopoint
      POSTGRES_DB: infopoint
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infopoint -d infopoint"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    image: infopoint-api:latest
    command: sh -c "alembic upgrade head && python -m app.tools.prepare_index && uvicorn app.main:app --host 0.0.0.0 --port 8080 --proxy-headers"
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8080"
    volumes:
      - ./data/models:/models:ro
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    image: infopoint-worker:latest
    command: python -m worker.main
    stop_grace_period: 60s
    volumes:
      - ./data/models:/models:ro
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
